[package]
name = "memwarden"
version = "0.1.0"
edition = "2024"
description = "Windows memory analysis and management tool"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["memory", "windows", "working-set", "pagefile"]
categories = ["gui"]
# The workspace also builds memwarden-host; `cargo run` starts the dashboard.
default-run = "memwarden"

[workspace]
members = ["host"]
# Plain `cargo build` / `cargo test` cover the native messaging host too.
default-members = [".", "host"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
# OpenGL renderer instead of the default wgpu: much lower memory footprint.
# System fonts are loaded selectively in theme.rs, so `system_fonts` is off.
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "persistence"] }
egui_extras = "0.37.0"
egui_plot = "0.38.0"
# Framing, pipe and browser lookup shared with the native messaging host.
memwarden-host = { path = "host" }
rust-i18n = "4.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
