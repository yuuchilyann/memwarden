[package]
name = "memwarden"
version = "0.1.0"
edition = "2024"
description = "Windows memory analysis and management tool"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["memory", "windows", "working-set", "pagefile"]
categories = ["command-line-utilities"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = "0.37.0"
egui_plot = "0.38.0"
rust-i18n = "4.2.4"
sys-locale = "0.3.2"
