[package]
name = "memwarden-host"
version = "0.1.0"
edition = "2024"
description = "Native messaging host relaying the memwarden browser extension to memwarden"
license = "MIT OR Apache-2.0"
publish = false

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
