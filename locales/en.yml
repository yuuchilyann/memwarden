tabs.incompatible: "The browser extension version is not compatible with memwarden"

integration.toggle: "Browser integration"
integration.explain: "Lets the memwarden extension for Chrome / Edge connect to this program to show tab counts and discard idle tabs (the extension is installed separately). Turning it on registers a Native Messaging host in the current user’s registry and creates %{path}; turning it off removes both."
