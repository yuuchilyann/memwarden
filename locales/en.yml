trim.running: "Trimming…"
trim.result: "Trimmed %{count} apps · %{size} out of RAM"
trim.explain: "For apps idle over %{min} min. Moves their memory out of RAM now (to standby, or to the page file / compressed memory). They keep running; their first actions afterwards may be slower while memory is read back. Apps playing or recording audio are never trimmed. Commit charge does not change."

tabs.summary: "%{name} · %{total} tabs · %{discarded} discarded · %{candidates} discardable"
tabs.discard: "Discard idle tabs (%{count})"
tabs.explain: "The browser extension unloads the contents of idle tabs. They stay in the tab strip and reload with one click. Active, audible and pinned tabs are never discarded. Unsaved form input may be lost. When all tabs of a process are discarded the process exits, so commit charge goes down too."
tabs.confirm: "Discard %{count} idle tabs of %{name}? Unsaved form input may be lost."
tabs.confirm_yes: "Discard"
tabs.running: "Discarding…"
tabs.measuring: "Discarded %{count} tabs · measuring…"
tabs.result: "Discarded %{count} tabs · browser private memory before/after %{change}"
tabs.incompatible: "The browser extension version is not compatible with memwarden"

close.summary: "Suggested to close: %{count} · about %{size}"
close.summary_tray: "Suggested to close: %{count} · about %{size} (%{tray} to quit from the tray)"
close.summary_help: "Apps idle for more than %{min} minutes with at least %{mb} MB of private memory. Commit charge only drops when an app releases memory itself, so closing apps you no longer need helps most; lowering priority and trimming do not reduce commit."
close.status: "Suggest closing"
close.status_help: "Idle for %{min} min, %{size} of private memory. Closing it lowers commit charge by about %{size}."
close.button: "Close"
close.explain: "Same as clicking the window's X. The app asks about unsaved work itself; some apps only hide in the notification area. memwarden never force-quits apps."
close.confirm: "Close %{name}? Same as clicking the window's X; the app asks about unsaved work itself."
close.confirm_yes: "Close"
close.running: "Closing %{name}…"
close.closed: "Closed %{name} · private memory −%{size}"
close.in_background: "%{name} closed its windows but keeps running in the background. Quit it from its notification area icon."
close.still_open: "%{name} did not close; it may be asking whether to save. Switch to it to answer."
close.refused: "Cannot close %{name}: %{reason}"
close.no_window: "No open window; quit this app from its notification area icon."
close.not_responding: "The app is not responding; try again later."
close.denied: "The app runs with higher privileges, so memwarden cannot close it."

growth.summary: "Keeps growing: %{count} · reopening frees about %{size}"
growth.summary_help: "Apps observed for at least %{min} minutes whose lowest private memory per minute rose by at least %{mb} MB and to at least %{ratio} times its earlier level, and still rose by at least %{rise} MB in each of the last two hours (browsers excluded; a single jump that then levels off does not count). This may be a memory leak or a cache that never shrinks; closing and reopening the app usually frees most of the increase and lowers commit charge. History builds up only while memwarden is open and covers up to 6 hours."
growth.status: "Growing +%{size}"
growth.status_help: "Rose from %{low} to %{current} over the past %{h} h %{m} min (lowest value per minute). Reopening the app usually frees most of the increase."
growth.confirm: "Close %{name}? Same as clicking the window's X; the app asks about unsaved work itself. memwarden does not reopen it; start it again yourself when you need it."

pagefile.system: "Page file managed by Windows: %{current} now; Windows grows it to about %{max} when needed, so the limit above is not fixed and can reach about %{limit}."
pagefile.custom: "Custom page file size: %{current} now, %{max} at most. The limit does not grow on its own; it can reach about %{limit}."
pagefile.none: "No page file: the limit is about the size of physical memory; when it is used up, programs cannot allocate memory."
pagefile.open: "Page file settings…"
pagefile.open_help: "Opens Windows Performance Options: on the Advanced tab, click Change under Virtual memory (administrator rights needed). Making the page file larger usually takes effect right away; shrinking, removing or moving it, or switching automatic management on or off needs a restart."

integration.toggle: "Browser integration"
integration.explain: "Lets the memwarden extension for Chrome / Edge connect to this program to show tab counts and discard idle tabs (the extension is installed separately). Turning it on registers a Native Messaging host in the current user’s registry and creates %{path}; turning it off removes both."
integration.unavailable: "memwarden-host.exe was not found next to memwarden, so browser integration cannot be turned on."
integration.elsewhere: "Browser integration points to another location; turn it on to use this copy"
