trim.result: "Trimmed %{count} apps · %{size} out of RAM"
trim.explain: "For apps idle over %{min} min. Moves their memory out of RAM now (to standby, or to the page file / compressed memory). They keep running; their first actions afterwards may be slower while memory is read back. Apps playing or recording audio are never trimmed. Commit charge does not change."

tabs.summary: "%{name} · %{total} tabs · %{discarded} discarded · %{candidates} discardable"
tabs.discard: "Discard idle tabs (%{count})"
tabs.explain: "The browser extension unloads the contents of idle tabs. They stay in the tab strip and reload with one click. Active, audible and pinned tabs are never discarded. Unsaved form input may be lost. When all tabs of a process are discarded the process exits, so commit charge goes down too."
