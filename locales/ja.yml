priority.confirm: "アイドル中の %{count} 件（%{size}）のメモリ優先度を下げますか？"
priority.confirm_yes: "下げる"
priority.cancel: "キャンセル"
priority.explain: "物理メモリが不足すると、Windows はこれらのアプリのメモリを優先的に回収します。アプリは動作し続け、再び使用したときや memwarden を終了したときに優先度は自動で元に戻ります。コミットチャージは減りません。"
priority.failed: "%{count} 件のプロセスは変更できませんでした（保護または管理者権限）"

trim.button: "トリム"
trim.all: "長時間アイドルをトリム (%{count})"
trim.confirm: "%{min} 分以上アイドルの %{count} 件（物理メモリ %{size}）をトリムしますか？"
trim.confirm_yes: "トリムする"
trim.running: "トリム中…"
trim.result: "%{count} 件をトリム · 物理メモリから %{size} を解放"
trim.explain: "%{min} 分以上アイドルのアプリが対象です。メモリをすぐに物理メモリから移します（スタンバイ、またはページファイル／メモリ圧縮へ）。アプリは動作し続けますが、次に使うときはメモリを読み戻すため少し遅くなることがあります。音声を再生・録音中のアプリはトリムされません。コミットチャージは減りません。"

tabs.summary: "%{name} · タブ %{total} · 破棄済み %{discarded} · 破棄可能 %{candidates}"
tabs.discard: "アイドルタブを破棄 (%{count})"
tabs.explain: "ブラウザー拡張機能がアイドルタブの内容をアンロードします。タブはタブバーに残り、クリックすると再読み込みされます。アクティブ、音声再生中、固定されたタブは破棄されません。未保存のフォーム入力は失われることがあります。プロセスのタブがすべて破棄されるとそのプロセスは終了するため、コミットチャージも減ります。"
tabs.confirm: "%{name} のアイドルタブ %{count} 件を破棄しますか？未保存のフォーム入力は失われることがあります。"
tabs.confirm_yes: "破棄する"
tabs.running: "破棄中…"
tabs.measuring: "%{count} 件のタブを破棄 · 計測中…"
tabs.result: "%{count} 件のタブを破棄 · ブラウザーのプライベートメモリ前後差 %{change}"
tabs.incompatible: "ブラウザー拡張機能のバージョンが memwarden と互換性がありません"

close.summary: "終了のおすすめ %{count} 個 · 約 %{size}"
close.summary_tray: "終了のおすすめ %{count} 個 · 約 %{size}（%{tray} 個は通知領域から終了）"
close.summary_help: "%{min} 分以上アイドルで、プライベートメモリが %{mb} MB 以上のアプリです。コミットチャージはアプリ自身がメモリを解放したときだけ下がるため、使わないアプリを閉じるのが最も効果的です。優先度の引き下げやトリムではコミットは減りません。"
close.status: "終了をおすすめ"
close.status_help: "%{min} 分間アイドル、プライベートメモリ %{size}。閉じるとコミットチャージが約 %{size} 下がります。"
close.button: "閉じる"
close.explain: "ウィンドウの × を押すのと同じです。未保存の内容があればアプリ自身が確認します。通知領域に隠れるだけのアプリもあります。memwarden がアプリを強制終了することはありません。"
close.confirm: "%{name} を閉じますか？ウィンドウの × を押すのと同じで、未保存の内容はアプリ自身が確認します。"
close.confirm_yes: "閉じる"
close.running: "%{name} を閉じています…"
close.closed: "%{name} を閉じました · プライベートメモリ −%{size}"
close.in_background: "%{name} のウィンドウは閉じましたが、バックグラウンドで実行中です。通知領域のアイコンから終了してください。"
close.still_open: "%{name} は閉じていません。保存するか確認している可能性があります。切り替えて対応してください。"
close.refused: "%{name} を閉じられません：%{reason}"
close.no_window: "開いているウィンドウがありません。通知領域のアイコンから終了してください。"
close.not_responding: "アプリが応答していません。しばらくしてからもう一度試してください。"
close.denied: "アプリが高い権限で実行されているため、memwarden からは閉じられません。"

growth.summary: "増え続けている %{count} 個 · 開き直すと約 %{size} 減少"
growth.summary_help: "%{min} 分以上観察し、1 分ごとのプライベートメモリの最小値が %{mb} MB 以上、かつ元の %{ratio} 倍以上に増えたアプリです（ブラウザーを除く）。メモリリークのほか、減らないキャッシュの可能性もあります。閉じて開き直すと、増えた分の大半が解放され、コミットチャージが下がるのが一般的です。履歴は memwarden を開いている間だけ記録され、最大 6 時間分を保持します。"
growth.status: "増加中 +%{size}"
growth.status_help: "過去 %{h} 時間 %{m} 分で %{low} から %{current} に増加しました（1 分ごとの最小値で計算）。開き直すと、増えた分の大半が解放されるのが一般的です。"
growth.confirm: "%{name} を閉じますか？ウィンドウの × を押すのと同じで、未保存の内容はアプリ自身が確認します。memwarden は開き直さないため、必要なときにご自身で起動してください。"

pagefile.system: "ページファイルは Windows が管理：現在 %{current}、必要に応じて約 %{max} まで自動的に拡張されるため、上記の上限は固定ではなく最大約 %{limit} になります。"
pagefile.custom: "ページファイルはカスタムサイズ：現在 %{current}、最大 %{max}。上限は自動的には増えず、最大約 %{limit} です。"
pagefile.none: "ページファイルなし：上限は物理メモリとほぼ同じで、使い切るとプログラムがメモリを確保できなくなります。"
pagefile.open: "ページファイルの設定…"
pagefile.open_help: "Windows の「パフォーマンス オプション」を開きます。「詳細設定」タブの「仮想メモリ」で「変更」を押してください（管理者権限が必要）。ページファイルの拡大は通常すぐに反映されます。縮小・削除・別ドライブへの移動、自動管理の切り替えには再起動が必要です。"

integration.toggle: "ブラウザー連携"
integration.explain: "Chrome／Edge 用の memwarden 拡張機能がこのプログラムに接続し、タブ数の表示とアイドルタブの破棄ができるようにします（拡張機能は別途インストールが必要です）。オンにすると現在のユーザーのレジストリに Native Messaging ホストを登録し、%{path} を作成します。オフにするとどちらも削除します。"
integration.unavailable: "memwarden と同じフォルダーに memwarden-host.exe が見つからないため、ブラウザー連携をオンにできません。"
integration.elsewhere: "ブラウザー連携が別の場所を指しています。オンにするとこのコピーを使います"
integration.failed: "ブラウザー連携を変更できませんでした：%{error}"
