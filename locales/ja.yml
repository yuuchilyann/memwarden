tabs.incompatible: "ブラウザー拡張機能のバージョンが memwarden と互換性がありません"

integration.toggle: "ブラウザー連携"
integration.explain: "Chrome／Edge 用の memwarden 拡張機能がこのプログラムに接続し、タブ数の表示とアイドルタブの破棄ができるようにします（拡張機能は別途インストールが必要です）。オンにすると現在のユーザーのレジストリに Native Messaging ホストを登録し、%{path} を作成します。オフにするとどちらも削除します。"
integration.unavailable: "memwarden と同じフォルダーに memwarden-host.exe が見つからないため、ブラウザー連携をオンにできません。"
integration.elsewhere: "ブラウザー連携が別の場所を指しています。オンにするとこのコピーを使います"
