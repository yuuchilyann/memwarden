trim.explain: "%{min} 分以上アイドルのアプリが対象です。メモリをすぐに物理メモリから移します（スタンバイ、またはページファイル／メモリ圧縮へ）。アプリは動作し続けますが、次に使うときはメモリを読み戻すため少し遅くなることがあります。音声を再生・録音中のアプリはトリムされません。コミットチャージは減りません。"

