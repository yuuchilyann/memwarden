kpi.physical.title: "物理メモリ"
kpi.physical.detail: "合計 %{total} · %{pct}%"
kpi.physical.help: "プログラムと Windows が現在実際に使っている RAM です。いつでも回収できるキャッシュは含みません。100% に近づくと、Windows はあまり使われないデータをページファイルに移し、動作が目に見えて遅くなります。"
kpi.commit.title: "コミットチャージ"
kpi.commit.detail: "上限 %{limit} · %{pct}%"
kpi.commit.help: "すべてのプログラムが Windows に予約したメモリの合計です。データが RAM とページファイルのどちらにあるかは問いません。上限は RAM とページファイルの合計で、上限に達するとプログラムはメモリを確保できず、クラッシュすることがあります。プログラムを閉じるかブラウザーのタブを破棄すると下がりますが、ワーキングセットのトリムでは下がりません。"
kpi.available.title: "利用可能"
kpi.available.detail: "スタンバイ + 空き · キャッシュ %{cache}"
kpi.available.help: "すぐにプログラムへ割り当てられる RAM です。完全に空いている部分と、スタンバイリストにある最近読み込んだファイルのデータを合わせたものです。キャッシュは必要に応じて自動的に解放されるため、キャッシュが大きく空きが少ないのは正常で、メモリ不足を意味しません。"
kpi.kernel.title: "カーネルプール"
kpi.kernel.detail: "ページ %{paged} · 非ページ %{nonpaged}"
kpi.kernel.help: "Windows カーネルとドライバーが使うメモリです。ページプールはページファイルに移せますが、非ページプールは常に RAM に残ります。増え続けて下がらない場合は、ドライバーのメモリリークの可能性があります。"

alert.commit: "コミットチャージが上限の %{pct}% に達しています。100% になるとアプリがクラッシュする恐れがあります。不要なアプリを閉じるか、ページファイルを拡張してください。"
alert.commit_auto: "コミットチャージが現在の上限の %{pct}% に達しています。ページファイルは Windows が管理しており自動的に拡張されます（上限は最大約 %{limit}）が、拡張の瞬間にメモリを確保できないプログラムが出ることがあります。使わないアプリを閉じるのがコミットを下げる最も効果的な方法です。"

