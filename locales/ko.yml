kpi.physical.title: "물리 메모리"
kpi.physical.detail: "전체 %{total} · %{pct}%"
kpi.physical.help: "프로그램과 Windows가 현재 실제로 사용 중인 RAM입니다. 언제든 회수할 수 있는 캐시는 포함하지 않습니다. 100%에 가까워지면 Windows가 덜 쓰는 데이터를 페이지 파일로 옮겨 컴퓨터가 눈에 띄게 느려집니다."
kpi.commit.title: "커밋 차지"
kpi.commit.detail: "한도 %{limit} · %{pct}%"
kpi.commit.help: "모든 프로그램이 Windows에 예약한 메모리의 합계입니다. 데이터가 RAM에 있든 페이지 파일에 있든 포함됩니다. 한도는 RAM과 페이지 파일을 합한 크기이며, 한도에 도달하면 프로그램이 메모리를 더 할당하지 못해 충돌할 수 있습니다. 프로그램을 닫거나 브라우저 탭을 삭제하면 줄어들지만, 작업 집합 정리로는 줄지 않습니다."
kpi.available.title: "사용 가능"
kpi.available.detail: "대기 + 여유 · 캐시 %{cache}"
kpi.available.help: "프로그램에 바로 내줄 수 있는 RAM입니다. 완전히 비어 있는 부분과 대기 목록에 있는 최근에 읽은 파일 데이터를 합한 것입니다. 캐시는 필요할 때 자동으로 해제되므로, 캐시가 크고 빈 메모리가 적은 것은 정상이며 메모리가 부족하다는 뜻이 아닙니다."
kpi.kernel.title: "커널 풀"
kpi.kernel.detail: "페이징 %{paged} · 비페이징 %{nonpaged}"
kpi.kernel.help: "Windows 커널과 드라이버가 사용하는 메모리입니다. 페이징 풀은 페이지 파일로 옮길 수 있지만, 비페이징 풀은 항상 RAM에 있어야 합니다. 계속 늘어나고 줄지 않는다면 드라이버의 메모리 누수일 수 있습니다."

alert.commit: "커밋 차지가 한도의 %{pct}%에 도달했습니다. 100%가 되면 앱이 메모리를 할당하지 못해 비정상 종료될 수 있습니다. 사용하지 않는 앱을 닫거나 페이지 파일을 늘리세요."
alert.commit_auto: "커밋 차지가 현재 한도의 %{pct}%에 도달했습니다. 페이지 파일은 Windows가 관리하며 자동으로 늘어나지만(한도 최대 약 %{limit}), 늘어나는 순간 메모리를 할당하지 못하는 프로그램이 생길 수 있습니다. 쓰지 않는 앱을 닫는 것이 커밋을 가장 많이 줄입니다."

