trim.button: "비우기"
trim.all: "장시간 유휴 앱 비우기 (%{count})"
trim.confirm: "%{min}분 이상 유휴 상태인 앱 %{count}개(물리 메모리 %{size})의 작업 집합을 비울까요?"
trim.confirm_yes: "비우기"
trim.running: "비우는 중…"
trim.result: "%{count}개 앱 비움 · 물리 메모리 %{size} 확보"
trim.explain: "%{min}분 이상 유휴 상태인 앱이 대상입니다. 메모리를 즉시 물리 메모리에서 내보냅니다(대기 목록 또는 페이지 파일/메모리 압축으로). 앱은 계속 실행되며, 다음에 사용할 때 메모리를 다시 읽어 오느라 잠시 느릴 수 있습니다. 소리를 재생하거나 녹음 중인 앱은 비우지 않습니다. 커밋 차지는 줄어들지 않습니다."

tabs.summary: "%{name} · 탭 %{total} · 삭제됨 %{discarded} · 삭제 가능 %{candidates}"
tabs.discard: "유휴 탭 삭제 (%{count})"
tabs.explain: "브라우저 확장 프로그램이 유휴 탭의 내용을 언로드합니다. 탭은 탭 표시줄에 남아 있으며 클릭하면 다시 로드됩니다. 활성 탭, 소리를 재생 중인 탭, 고정된 탭은 삭제하지 않습니다. 저장하지 않은 양식 입력은 사라질 수 있습니다. 한 프로세스의 탭이 모두 삭제되면 그 프로세스가 종료되므로 커밋 차지도 줄어듭니다."
tabs.confirm: "%{name}의 유휴 탭 %{count}개를 삭제할까요? 저장하지 않은 양식 입력은 사라질 수 있습니다."
tabs.confirm_yes: "삭제"
tabs.running: "삭제 중…"
tabs.measuring: "탭 %{count}개 삭제 · 측정 중…"
tabs.result: "탭 %{count}개 삭제 · 브라우저 개인 메모리 전후 차이 %{change}"
tabs.incompatible: "브라우저 확장 프로그램 버전이 memwarden과 호환되지 않습니다"

close.summary: "종료 권장 %{count}개 · 약 %{size}"
close.summary_tray: "종료 권장 %{count}개 · 약 %{size} (%{tray}개는 알림 영역에서 종료)"
close.summary_help: "%{min}분 넘게 유휴 상태이고 개인 메모리가 %{mb}MB 이상인 앱입니다. 커밋 차지는 앱이 스스로 메모리를 해제할 때만 줄어들므로, 쓰지 않는 앱을 닫는 것이 가장 효과적입니다. 우선순위 낮추기와 정리로는 커밋이 줄지 않습니다."
close.status: "종료 권장"
close.status_help: "%{min}분 동안 유휴, 개인 메모리 %{size}. 닫으면 커밋 차지가 약 %{size} 줄어듭니다."
close.button: "닫기"
close.explain: "창의 X를 누르는 것과 같습니다. 저장하지 않은 내용이 있으면 앱이 직접 묻습니다. 알림 영역으로 숨기만 하는 앱도 있습니다. memwarden은 앱을 강제 종료하지 않습니다."
close.confirm: "%{name}을(를) 닫을까요? 창의 X를 누르는 것과 같으며, 저장하지 않은 내용은 앱이 직접 묻습니다."
close.confirm_yes: "닫기"
close.running: "%{name} 닫는 중…"
close.closed: "%{name} 닫음 · 개인 메모리 −%{size}"
close.in_background: "%{name}의 창은 닫혔지만 백그라운드에서 계속 실행 중입니다. 알림 영역 아이콘에서 종료하세요."
close.still_open: "%{name}이(가) 닫히지 않았습니다. 저장 여부를 묻고 있을 수 있으니 전환해서 확인하세요."
close.refused: "%{name}을(를) 닫을 수 없습니다: %{reason}"
close.no_window: "열린 창이 없습니다. 알림 영역 아이콘에서 이 앱을 종료하세요."
close.not_responding: "앱이 응답하지 않습니다. 잠시 후 다시 시도하세요."
close.denied: "앱이 더 높은 권한으로 실행 중이어서 memwarden이 닫을 수 없습니다."

growth.summary: "계속 증가 %{count}개 · 다시 열면 약 %{size} 감소"
growth.summary_help: "%{min}분 이상 관찰했고, 분당 최소 개인 메모리가 %{mb}MB 이상, 그리고 처음의 %{ratio}배 이상으로 늘어났으며, 최근 2시간 동안 매시간 %{rise}MB 이상 계속 늘어난 앱입니다(브라우저 제외, 한 번 늘어난 뒤 그대로인 경우는 제외). 메모리 누수일 수도 있고 줄어들지 않는 캐시일 수도 있습니다. 닫았다가 다시 열면 보통 늘어난 메모리의 대부분이 해제되어 커밋 차지가 줄어듭니다. 기록은 memwarden이 열려 있는 동안만 쌓이며 최대 6시간까지 보관합니다."
growth.status: "계속 증가 +%{size}"
growth.status_help: "지난 %{h}시간 %{m}분 동안 %{low}에서 %{current}(으)로 늘었습니다(분당 최솟값 기준). 다시 열면 보통 늘어난 메모리의 대부분이 해제됩니다."
growth.confirm: "%{name}을(를) 닫을까요? 창의 X를 누르는 것과 같으며, 저장하지 않은 내용은 앱이 직접 묻습니다. memwarden은 앱을 다시 열지 않으니 필요할 때 직접 실행하세요."

pagefile.system: "페이지 파일은 Windows가 관리: 현재 %{current}, 필요하면 약 %{max}까지 자동으로 늘어나므로 위의 한도는 고정이 아니며 최대 약 %{limit}입니다."
pagefile.custom: "페이지 파일은 사용자 지정 크기: 현재 %{current}, 최대 %{max}. 한도는 자동으로 늘지 않으며 최대 약 %{limit}입니다."
pagefile.none: "페이지 파일 없음: 한도가 물리 메모리와 거의 같으며, 다 쓰면 프로그램이 메모리를 할당할 수 없습니다."
pagefile.open: "페이지 파일 설정…"
pagefile.open_help: "Windows의 '성능 옵션'을 엽니다. '고급' 탭의 '가상 메모리'에서 '변경'을 누르세요(관리자 권한 필요). 페이지 파일을 늘리면 보통 바로 적용되고, 줄이기·제거·다른 드라이브로 이동하거나 자동 관리를 전환하면 다시 시작해야 합니다."

integration.toggle: "브라우저 연동"
integration.explain: "Chrome/Edge용 memwarden 확장 프로그램이 이 프로그램에 연결해 탭 수를 표시하고 유휴 탭을 삭제할 수 있게 합니다(확장 프로그램은 별도로 설치해야 합니다). 켜면 현재 사용자 레지스트리에 Native Messaging 호스트를 등록하고 %{path}을(를) 만듭니다. 끄면 둘 다 삭제합니다."
integration.unavailable: "memwarden과 같은 폴더에서 memwarden-host.exe를 찾을 수 없어 브라우저 연동을 켤 수 없습니다."
integration.elsewhere: "브라우저 연동이 다른 위치를 가리키고 있습니다. 켜면 이 사본을 사용합니다"
integration.failed: "브라우저 연동을 변경하지 못했습니다: %{error}"
