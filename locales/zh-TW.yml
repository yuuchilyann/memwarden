priority.cancel: "取消"
priority.explain: "實體記憶體不足時，Windows 會優先回收這些程式的記憶體。程式會繼續執行；當你再次使用它們或關閉 memwarden 時，優先權會自動還原。認可記憶體 (Commit) 不會因此減少。"
priority.failed: "%{count} 個程序無法變更（受保護或權限較高）"

trim.button: "修剪"
trim.all: "修剪長時間閒置 (%{count})"
trim.confirm: "要修剪閒置超過 %{min} 分鐘的 %{count} 個程式（占實體記憶體 %{size}）嗎？"
trim.confirm_yes: "確定修剪"
trim.running: "修剪中…"
trim.result: "已修剪 %{count} 個 · 移出實體記憶體 %{size}"
trim.explain: "適用於閒置超過 %{min} 分鐘的程式。立即把它們的記憶體移出實體記憶體（移到備用清單，或寫入分頁檔／記憶體壓縮）。程式會繼續執行；之後第一次使用時，讀回記憶體可能會稍慢。正在播放或錄音的程式不會被修剪。認可記憶體 (Commit) 不會因此減少。"

tabs.summary: "%{name} · 分頁 %{total} · 已丟棄 %{discarded} · 可丟棄 %{candidates}"
tabs.discard: "丟棄閒置分頁 (%{count})"
tabs.explain: "由瀏覽器擴充功能卸載閒置分頁的內容。分頁仍留在分頁列，點一下就會重新載入。作用中、正在播放聲音或已釘選的分頁不會被丟棄。未儲存的表單內容可能遺失。當一個程序的分頁全部被丟棄時，該程序會結束，因此認可記憶體 (Commit) 也會減少。"
tabs.confirm: "要丟棄 %{name} 的 %{count} 個閒置分頁嗎？未儲存的表單內容可能遺失。"
tabs.confirm_yes: "確定丟棄"
tabs.running: "丟棄中…"
tabs.measuring: "已丟棄 %{count} 個分頁 · 量測中…"
tabs.result: "已丟棄 %{count} 個分頁 · 瀏覽器私有記憶體前後差值 %{change}"
tabs.incompatible: "瀏覽器擴充功能的版本與 memwarden 不相容"

close.summary: "建議關閉 %{count} 個 · 約 %{size}"
close.summary_tray: "建議關閉 %{count} 個 · 約 %{size}（%{tray} 個需從系統匣結束）"
close.summary_help: "閒置超過 %{min} 分鐘、私有記憶體至少 %{mb} MB 的程式。只有程式自己釋放記憶體才會降低認可記憶體 (Commit)，所以關掉用不到的程式最有效；降低優先權和修剪都不會減少 Commit。"
close.status: "建議關閉"
close.status_help: "已閒置 %{min} 分鐘，私有記憶體 %{size}。關閉後認可記憶體 (Commit) 約可降低 %{size}。"
close.button: "關閉"
close.explain: "等同按下視窗的 X。有未儲存的內容時，程式會自己詢問；有些程式只會縮到系統匣。memwarden 不會強制結束程式。"
close.confirm: "要關閉 %{name} 嗎？等同按下視窗的 X，未儲存的內容由程式自己詢問。"
close.confirm_yes: "確定關閉"
close.running: "正在關閉 %{name}…"
close.closed: "已關閉 %{name} · 私有記憶體 −%{size}"
close.in_background: "%{name} 的視窗已關閉，但程式仍在背景執行。請從系統匣圖示選擇結束。"
close.still_open: "%{name} 沒有關閉，可能正在詢問是否儲存，請切換過去處理。"
close.refused: "無法關閉 %{name}：%{reason}"
close.no_window: "沒有開啟的視窗，請從系統匣圖示結束這個程式。"
close.not_responding: "程式沒有回應，請稍後再試。"
close.denied: "程式以較高權限執行，memwarden 無法關閉它。"

growth.summary: "持續成長 %{count} 個 · 重新開啟約可降低 %{size}"
growth.summary_help: "觀察至少 %{min} 分鐘，私有記憶體的每分鐘最低值增加至少 %{mb} MB、且是原本的 %{ratio} 倍以上的程式（不含瀏覽器）。可能是記憶體洩漏，也可能是只增不減的快取；關閉後重新開啟，通常能釋放大部分增加的記憶體並降低認可記憶體 (Commit)。歷史只在 memwarden 開著時累計，最多保留 6 小時。"
growth.status: "持續成長 +%{size}"
growth.status_help: "過去 %{h} 小時 %{m} 分從 %{low} 增加到 %{current}（以每分鐘最低值計算）。重新開啟通常能釋放大部分增加的記憶體。"
growth.confirm: "要關閉 %{name} 嗎？等同按下視窗的 X，未儲存的內容由程式自己詢問。memwarden 不會重新開啟它，需要時請自行開啟。"

pagefile.system: "分頁檔由系統管理：目前 %{current}，必要時 Windows 會自動加大到約 %{max}，所以上方的上限不是固定的，最多約 %{limit}。"
pagefile.custom: "分頁檔為自訂大小：目前 %{current}，最大 %{max}。上限不會自動變大，最多約 %{limit}。"
pagefile.none: "沒有分頁檔：上限約等於實體記憶體，用完時程式會無法配置記憶體。"
pagefile.open: "調整分頁檔…"
pagefile.open_help: "開啟 Windows 的「效能選項」：切到「進階」分頁，在「虛擬記憶體」按「變更」，需要系統管理員權限。加大分頁檔通常立即生效；縮小、移除、改到其他磁碟機，或切換「自動管理」時需要重新開機。"

integration.toggle: "瀏覽器整合"
integration.explain: "讓 Chrome／Edge 的 memwarden 擴充功能連線到這個程式，以顯示分頁數並丟棄閒置分頁（擴充功能需另外安裝）。開啟時會在目前使用者的登錄寫入 Native Messaging 註冊，並建立 %{path}；關閉時全部刪除。"
integration.unavailable: "找不到與 memwarden 放在同一個資料夾的 memwarden-host.exe，無法啟用瀏覽器整合。"
integration.elsewhere: "瀏覽器整合目前指向其他位置，勾選可改用這一份"
integration.failed: "無法變更瀏覽器整合：%{error}"
